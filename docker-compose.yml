services:
  giftlist:
    build: .
    container_name: giftlist
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      LIST_TITLE: "My Wishlist"
      ADMIN_PASSWORD: "change-me"      # people without it can view but not edit
      REFRESH_HOURS: "12"              # how often prices are re-checked
      SALE_DROP_PERCENT: "5"           # % below usual price that counts as a sale
      TZ: "America/Chicago"
